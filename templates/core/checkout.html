{% extends 'partials/newbase.html' %}
{% load static %}

{% block title %}Checkout - Fabrything{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/checkout-flow.css' %}">
{% endblock %}

{% block content %}
<div id="checkout-root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>

<script type="text/babel">
  // Import components dynamically or inline
  const { useState, useEffect } = React;
  const { motion, AnimatePresence } = window;

  // Inline CheckoutFlow component
  import CheckoutFlow from '{% static "js/react/components/CheckoutFlow.jsx" %}?v=1';
  

  const root = ReactDOM.createRoot(document.getElementById('checkout-root'));
  root.render(<CheckoutFlow />);
</script>
{% endblock %}
