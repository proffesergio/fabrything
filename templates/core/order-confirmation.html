{% extends 'partials/newbase.html' %}
{% load static %}

{% block title %}Order Confirmation - {{ site_name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/tier1-cart-checkout.css' %}">
{% endblock %}

{% block content %}
<div id="confirmation-root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>
<script type="module">
  import OrderConfirmation from '{% static "js/react/components/OrderConfirmation.jsx" %}?v=1';
  
  // Get order ID from URL
  const pathParts = window.location.pathname.split('/');
  const orderId = pathParts[pathParts.length - 2];
  
  const root = ReactDOM.createRoot(document.getElementById('confirmation-root'));
  root.render(React.createElement(OrderConfirmation, { orderId }));
</script>
{% endblock %}
