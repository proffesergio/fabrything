<div class="products mb-3" id="filtered-products">
    <div class="row">
        {% for product in products %}
        <div class="col-6 col-md-4 col-xl-3">
            <div class="product">
                <figure class="product-media">
                    <span class="product-label label-new">Save -{{ product.get_discount|floatformat:0 }}৳</span>
                    <a href="product.html">
                        <img src="{{ product.image.url }}" alt="Product image" class="product-image">
                    </a>

                    <div class="product-action-vertical">
                        <a href="#" class="btn-product-icon btn-wishlist btn-expandable"><span>add to wishlist</span></a>
                        <a href="#" class="btn-product-icon btn-compare" title="Compare"><span>Compare</span></a>
                        <a href="popup/quickView.html" class="btn-product-icon btn-quickview" title="Quick view"><span>Quick
                                view</span></a>
                    </div><!-- End .product-action-vertical -->

                    <div class="product-action">
                        <a href="#" class="btn-product btn-cart" title="Add to cart"><span>add to cart</span></a>
                    </div><!-- End .product-action -->
                </figure><!-- End .product-media -->

                <div class="product-body">
                    <div class="product-cat">
                        <a href="#">{{ product.category.title }}</a>
                    </div><!-- End .product-cat -->
                    <h3 class="product-title"><a href="product.html">{{ product.title }}</a></h3><!-- End .product-title -->
                    <div class="product-price">
                        <span class="new-price">৳{{ product.price }}</span>
                    </div><!-- End .product-price -->
                    {% for revs in reviews %}
                    <div class="ratings-container">
                        <div class="ratings">
                            <div class="ratings-val" style="width: 80%;">{{ revs.rating }}</div><!-- End .ratings-val -->
                        </div><!-- End .ratings -->
                        <span class="ratings-text">( {{ revs.count }} Reviews )</span>
                    </div>
                    {% endfor %}
                    <!-- End .rating-container -->
                </div><!-- End .product-body -->
            </div><!-- End .product -->
        </div><!-- End .col-sm-6 col-md-4 col-xl-3 -->
        {% endfor %}
    </div>
</div>
